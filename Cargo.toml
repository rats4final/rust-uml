[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# The web app only builds for wasm32; `cargo xtask wasm` checks it.
default-members = ["crates/*", "apps/desktop", "apps/cli", "xtask"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# internal, lowest layer first (see AGENTS.md › Layers)
mdj = { path = "crates/mdj" }
mermaid = { path = "crates/mermaid" }
uml = { path = "crates/uml" }
render = { path = "crates/render" }
engine = { path = "crates/engine" }
ui = { path = "crates/ui" }
automation = { path = "crates/automation" }

# external
ab_glyph = "0.2"
anyhow = "1"
base64 = "0.23"
eframe = { version = "0.36", default-features = false }
getrandom = "0.3"
egui = { version = "0.36", default-features = false }
egui_kittest = { version = "0.36", features = ["eframe"] }
indexmap = "2"
resvg = { version = "0.48", default-features = false, features = ["text"] }
rfd = "0.17"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
web-time = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

# "Never crash": no panicking shortcuts outside tests (clippy.toml allows them in tests).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# Browser build: the wasm is downloaded on every visit, so optimise for size.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = "debuginfo"
