name: Release

# Push a tag like v0.1.0 to build every platform and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  TRUNK_VERSION: v0.21.14

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04 # older glibc, so the binary runs on more distros
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p desktop -p cli
      - name: Package
        shell: bash
        run: |
          name="rust-uml-${TAG}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          for bin in rust-uml rust-uml-cli; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}" "dist/$name/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE ATTRIBUTION.md examples/shapes.mdj examples/structures.mdj examples/behaviour.mdj "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          # Archives only: the staging folders also contain dots (v0.1.0).
          path: |
            dist/*.tar.gz
            dist/*.zip

  web:
    name: web-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin
      - name: Build
        working-directory: apps/web
        run: trunk build --release
      - name: Package
        run: |
          name="rust-uml-${TAG}-web"
          mv apps/web/dist "$name"
          zip -qr "$name.zip" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: rust-uml-*-web.zip

  publish:
    needs: [desktop, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(artifacts/*.tar.gz artifacts/*.zip)
          ls -la "${files[@]}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "rust-uml $TAG" --notes-file .github/release-notes.md --prerelease
          fi
